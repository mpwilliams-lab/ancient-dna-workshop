<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ancient DNA of Britain</title>
  </head>
  <body>
    <div id="app">
      <header id="bar">
        <h1 id="app-title"></h1>
        <button id="wrap-open" type="button"></button>
      </header>
      <main id="panes">
        <section id="terminal" aria-label="Terminal"></section>
        <section id="plot" aria-label="Plot"></section>
      </main>
      <div id="wrap" hidden role="dialog" aria-modal="true" aria-labelledby="wrap-line">
        <div class="wrap-card">
          <p id="wrap-line"></p>
          <p id="wrap-caption"></p>
          <div id="wrap-qr"></div>
          <p id="wrap-url"></p>
          <p id="wrap-org"></p>
          <button id="wrap-close" type="button"></button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
